name: Deploy offline game to GitHub Pages

on:
  push:
    branches:
      - pages/offline-game
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.nojekyll'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static entry page exists
        run: |
          if [ ! -f index.html ]; then
            echo 'Missing index.html. Add the verified offline game entry page before deploying.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wait for Pages artifact registration
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
